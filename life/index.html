*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#252420;color:#f3efe6;font:16px/1.5 "Golos Text",Arial,sans-serif;display:grid;place-items:center;overflow:hidden;background-image:linear-gradient(rgba(243,239,230,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(243,239,230,.05) 1px,transparent 1px);background-size:44px 44px}
.gate{position:relative;width:min(100% - 40px,460px);padding:44px 40px 36px;border-radius:26px;background:rgba(37,36,32,.72);border:1px solid rgba(243,239,230,.14);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 40px 80px -40px rgba(0,0,0,.7)}

label{display:block;margin:0 0 14px;font-size:12px;color:#cfcabf;letter-spacing:.04em}
input{display:block;width:100%;margin-top:6px;padding:13px 16px;border-radius:12px;border:1px solid rgba(243,239,230,.22);background:rgba(243,239,230,.06);color:#f3efe6;font:16px/1.4 "Golos Text",Arial,sans-serif;outline:none;transition:border-color .2s,background-color .2s}

button:hover{background:#b4432d;color:#fff}button:disabled{opacity:.6;cursor:wait}
button svg{width:18px;height:18px}
.gate-error{min-height:22px;margin:14px 0 0;font-size:13px;color:#e28a70}
.gate-note{margin:26px 0 0;font-size:12px;line-height:1.55;color:#8f8b81}
.gate-wm{position:fixed;left:-.03em;bottom:-.16em;margin:0;font:400 clamp(120px,24vw,460px)/1 "Prata",Georgia,serif;letter-spacing:-.04em;white-space:nowrap;color:transparent;-webkit-text-stroke:1px rgba(243,239,230,.12);pointer-events:none;user-select:none}

(async()=>{
const payload=JSON.parse(document.getElementById('gate-data').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const SEP=String.fromCharCode(0);
const form=document.getElementById('gate-form'),err=document.getElementById('gate-error'),btn=form.querySelector('button');
async function keyFrom(login,password){
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(login.trim().toLowerCase()+SEP+password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.it,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unlock(key){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.data));
  const html=new TextDecoder().decode(plain);
  const exported=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));
  try{localStorage.setItem('gate.key',exported);localStorage.setItem('gate.salt',payload.salt);localStorage.setItem('gate.until',String(Date.now()+7*864e5));}catch(e){}
  if(document.readyState==='loading')await new Promise(r=>addEventListener('DOMContentLoaded',r,{once:true}));
  await new Promise(r=>setTimeout(r,0));
  document.open();document.write(html);document.close();
}
try{
  const saved=localStorage.getItem('gate.key');
  if(saved&&localStorage.getItem('gate.salt')===payload.salt&&Number(localStorage.getItem('gate.until'))>Date.now()){
    const key=await crypto.subtle.importKey('raw',b64(saved),{name:'AES-GCM'},true,['decrypt']);
    await unlock(key);return;
  }
}catch(e){try{localStorage.removeItem('gate.key');}catch(_){}}
document.documentElement.classList.add('ready');
form.login.focus();
form.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';btn.disabled=true;form.parentElement.classList.add('is-busy');
  try{
    const key=await keyFrom(form.login.value,form.password.value);
    await unlock(key);
  }catch(ex){
    err.textContent='Неверный логин или пароль.';btn.disabled=false;form.parentElement.classList.remove('is-busy');form.password.select();
  }
});
})();
</script></body></html>
