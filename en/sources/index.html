@font-face{font-family:"Golos Fallback";src:local("Arial");size-adjust:105%}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;min-height:100dvh;padding:20px 0;display:grid;place-items:center;background:#252420;color:#f3efe6;font:16px/1.5 "Golos Text","Golos Fallback",Arial,sans-serif;background-image:linear-gradient(rgba(243,239,230,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(243,239,230,.05) 1px,transparent 1px);background-size:44px 44px}
.gate{position:relative;width:min(100% - 40px,460px);padding:44px 40px 36px;border-radius:26px;background:rgba(37,36,32,.72);border:1px solid rgba(243,239,230,.14);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 40px 80px -40px rgba(0,0,0,.7);transition:opacity .26s ease,transform .26s cubic-bezier(.4,0,.2,1)}
.gate-logo{width:150px;height:auto;display:block;margin-bottom:34px}
.gate-lang{position:absolute;top:40px;right:30px;display:flex;gap:2px;font-size:11px;font-weight:500;letter-spacing:.04em}
.gate-lang a,.gate-lang span{padding:6px 9px;border-radius:999px;color:#bdb9ae;text-decoration:none;transition:background-color .2s,color .2s}
.gate-lang a:hover{color:#f3efe6;background:rgba(243,239,230,.1)}.gate-lang span{color:#252420;background:#f3efe6}
.gate-lang a:focus-visible{outline:2px solid #e28a70;outline-offset:1px}
.gate-eyebrow{margin:0 0 14px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#bdb9ae}
h1{margin:0 0 26px;font:400 clamp(30px,5vw,40px)/1.05 "Prata","Prata Fallback",Georgia,serif;letter-spacing:-.04em}
label{display:block;margin:0 0 14px;font-size:12px;color:#cfcabf;letter-spacing:.04em}
input{display:block;width:100%;margin-top:6px;padding:13px 16px;border-radius:12px;border:1px solid rgba(243,239,230,.22);background:rgba(243,239,230,.06);color:#f3efe6;font:16px/1.4 "Golos Text","Golos Fallback",Arial,sans-serif;outline:none;transition:border-color .2s,background-color .2s}
input:focus{border-color:#e28a70;background:rgba(243,239,230,.1)}
button{display:inline-flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin-top:10px;min-height:54px;padding:0 22px;border:0;border-radius:999px;background:#f3efe6;color:#252420;font:500 15px/1 "Golos Text","Golos Fallback",Arial,sans-serif;cursor:pointer;transition:background-color .25s,color .25s}
button:hover{background:#b4432d;color:#fff}button:disabled{opacity:.6;cursor:wait}
button svg{width:18px;height:18px;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
#gate-form button:hover:not(:disabled) svg{transform:translateX(4px)}
.gate-error{min-height:22px;margin:14px 0 0;font-size:13px;color:#e28a70}
.gate-note{margin:26px 0 0;font-size:12px;line-height:1.55;color:#8f8b81}
/* Водяной знак обрезается по окну собственной рамкой: страница теперь прокручивается, и надпись не должна её расширять. */
.gate-wm{position:fixed;inset:0;margin:0;overflow:hidden;pointer-events:none;user-select:none}
.gate-wm span{position:absolute;left:-.03em;bottom:-.16em;font:400 clamp(120px,24vw,460px)/1 "Prata","Prata Fallback",Georgia,serif;letter-spacing:-.04em;white-space:nowrap;color:transparent;-webkit-text-stroke:1px rgba(243,239,230,.12)}
/* Пока выводится ключ: вместо стрелки на кнопке — кольцо ожидания. Неверный пароль — поля вздрагивают.
   После входа карточка уходит вверх, и только потом подставляется страница. */
.gate.is-busy{opacity:.86}
.gate.is-busy #gate-form button svg{display:none}
.gate.is-busy #gate-form button::after{content:"";width:16px;height:16px;flex-shrink:0;border-radius:50%;border:2px solid currentColor;border-right-color:transparent}
.gate.is-leaving{opacity:0;transform:translateY(-14px) scale(.985)}
html:not(.ready) .gate{visibility:hidden}
html.vi{--vi-scale:1;font-size:calc(18px*var(--vi-scale))}html.vi[data-vi-size="2"]{--vi-scale:1.4}html.vi[data-vi-size="3"]{--vi-scale:1.8}
html.vi body{background:#fff !important;color:#000 !important;background-image:none !important;font-size:1rem;font-family:"Golos Text","Golos Fallback",Arial,sans-serif}
html.vi[data-vi-theme="wb"] body{background:#000 !important;color:#fff !important}
html.vi[data-vi-theme="bb"] body{background:#9dd1ff !important;color:#063462 !important}
html.vi .gate{background:transparent;border:3px solid currentColor;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;width:min(100% - 40px,680px);border-radius:12px;animation:none !important;transition:none;overflow-wrap:anywhere}
html.vi .gate-wm{display:none}html.vi h1{font:700 min(2rem,9.5vw)/1.2 "Golos Text","Golos Fallback",Arial,sans-serif;letter-spacing:0;color:inherit}
html.vi :is(.gate-eyebrow,label,.gate-note,.gate-error){color:inherit;font-size:1rem;letter-spacing:0;text-transform:none}
html.vi input{font-size:1rem;color:inherit;background:transparent;border:2px solid currentColor;border-radius:8px}
html.vi button{font-size:1rem;min-height:3.2em;background:transparent;color:inherit;border:2px solid currentColor;border-radius:8px}html.vi button:hover{background:transparent;color:inherit;text-decoration:underline}
html.vi .gate-lang{position:static;margin:0 0 20px;font-size:1rem}html.vi .gate-lang a,html.vi .gate-lang span{color:inherit;background:transparent;text-decoration:underline}html.vi .gate-lang span{text-decoration:none;font-weight:700}
html.vi .gate-logo{filter:invert(1)}html.vi[data-vi-theme="wb"] .gate-logo{filter:none}
.gate-vi{display:inline-block;width:auto;min-height:0;margin:22px 0 0;padding:0;border:0;border-radius:0;background:none;color:#bdb9ae;font:500 12px/1.4 "Golos Text","Golos Fallback",Arial,sans-serif;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.gate-vi:hover{background:none;color:#f3efe6}html.vi .gate-vi{border:0;min-height:0;font-size:1rem;color:inherit}
html:not(.vi) .when-vi,html.vi .when-normal{display:none}
/* Низкое окно: ноутбук 1366×768 с масштабом, окно не на весь экран. Карточка сжимается и помещается целиком;
   если не помещается и так, страница прокручивается (раньше низ карточки обрезался без прокрутки). */
@media (max-height:720px){
body{padding:8px 0}
.gate{padding:30px 36px 22px}.gate-lang{top:26px}
.gate-logo{width:136px;margin-bottom:20px}.gate-eyebrow{margin-bottom:10px}
h1{font-size:30px;margin-bottom:18px}
label{margin-bottom:12px}input{padding:11px 16px}
button{min-height:50px}.gate-error{margin-top:10px}.gate-note{margin-top:12px}.gate-vi{margin-top:10px}
}
/* Телефон в альбомной ориентации: слева название, справа форма. */
@media (max-height:500px) and (min-width:640px){
.gate{width:min(100% - 32px,780px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:36px;align-items:start;padding:22px 28px 18px}
.gate>*{grid-column:1}
#gate-form{grid-column:2;grid-row:1/span 6;align-self:center;padding-top:22px}
.gate-lang{top:14px;right:20px}
.gate-logo{width:124px;margin-bottom:14px}h1{font-size:28px;margin-bottom:12px}
label{margin-bottom:10px}input{padding:9px 14px}button{min-height:46px}
.gate-note{margin-top:0}.gate-vi{justify-self:start}
}
/* Узкий телефон: переключатель языка не должен наезжать на логотип. */
@media (max-width:400px){.gate{padding-inline:24px}.gate-lang{right:16px}}
@media (max-width:345px){.gate-logo{width:118px}.gate-lang{font-size:10px}.gate-lang a,.gate-lang span{padding:5px 7px}}
html.vi .gate{display:block;padding:28px 24px}html.vi #gate-form{padding-top:0}html.vi .gate-logo{width:150px;margin-bottom:24px}
@media (prefers-reduced-motion:no-preference){
html.ready .gate{animation:in .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#gate-form.is-wrong{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.gate.is-busy #gate-form button::after{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
}

(async()=>{
const payload=JSON.parse(document.getElementById('gate-data').textContent);
const TEXT=payload.text;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const SEP=String.fromCharCode(0);
const form=document.getElementById('gate-form'),err=document.getElementById('gate-error'),btn=form.querySelector('button'),card=form.parentElement;
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches||document.documentElement.classList.contains('vi');
window.__gateReady=true;
if(!(window.crypto&&crypto.subtle&&window.TextEncoder)){document.documentElement.classList.add('ready');btn.disabled=true;err.textContent=TEXT.insecure;return;}
async function keyFrom(login,password){
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(login.trim().toLowerCase()+SEP+password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.it,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unlock(key,shown){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.data));
  const html=new TextDecoder().decode(plain);
  const exported=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));
  try{localStorage.setItem('gate.key',exported);localStorage.setItem('gate.salt',payload.salt);localStorage.setItem('gate.until',String(Date.now()+7*864e5));}catch(e){}
  if(document.readyState==='loading')await new Promise(r=>addEventListener('DOMContentLoaded',r,{once:true}));
  if(shown&&!calm()){card.classList.add('is-leaving');await new Promise(r=>setTimeout(r,240));}
  else await new Promise(r=>setTimeout(r,0));
  document.open();document.write(html);document.close();
}
try{
  const saved=localStorage.getItem('gate.key');
  if(saved&&localStorage.getItem('gate.salt')===payload.salt&&Number(localStorage.getItem('gate.until'))>Date.now()){
    const key=await crypto.subtle.importKey('raw',b64(saved),{name:'AES-GCM'},true,['decrypt']);
    await unlock(key,false);return;
  }

form.login.focus({preventScroll:true});
