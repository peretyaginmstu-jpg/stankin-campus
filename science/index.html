.gate{position:relative;width:min(100% - 40px,460px);padding:44px 40px 36px;border-radius:26px;background:rgba(37,36,32,.72);border:1px solid rgba(243,239,230,.14);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 40px 80px -40px rgba(0,0,0,.7);transition:opacity .26s ease,transform .26s cubic-bezier(.4,0,.2,1)}

/* Водяной знак обрезается по окну собственной рамкой: страница теперь прокручивается, и надпись не должна её расширять. */
.gate-wm{position:fixed;inset:0;margin:0;overflow:hidden;pointer-events:none;user-select:none}
.gate-wm span{position:absolute;left:-.03em;bottom:-.16em;font:400 clamp(120px,24vw,460px)/1 "Prata","Prata Fallback",Georgia,serif;letter-spacing:-.04em;white-space:nowrap;color:transparent;-webkit-text-stroke:1px rgba(243,239,230,.12)}
/* Пока выводится ключ: вместо стрелки на кнопке — кольцо ожидания. Неверный пароль — поля вздрагивают.

.gate.is-busy{opacity:.86}
.gate.is-busy #gate-form button svg{display:none}
.gate.is-busy #gate-form button::after{content:"";width:16px;height:16px;flex-shrink:0;border-radius:50%;border:2px solid currentColor;border-right-color:transparent}
.gate.is-leaving{opacity:0;transform:translateY(-14px) scale(.985)}

}

(async()=>{
const payload=JSON.parse(document.getElementById('gate-data').textContent);
const TEXT=payload.text;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const SEP=String.fromCharCode(0);
const form=document.getElementById('gate-form'),err=document.getElementById('gate-error'),btn=form.querySelector('button'),card=form.parentElement;
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches||document.documentElement.classList.contains('vi');
window.__gateReady=true;
if(!(window.crypto&&crypto.subtle&&window.TextEncoder)){document.documentElement.classList.add('ready');btn.disabled=true;err.textContent=TEXT.insecure;return;}
async function keyFrom(login,password){
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(login.trim().toLowerCase()+SEP+password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.it,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unlock(key,shown){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.data));
  const html=new TextDecoder().decode(plain);
  const exported=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));
  try{localStorage.setItem('gate.key',exported);localStorage.setItem('gate.salt',payload.salt);localStorage.setItem('gate.until',String(Date.now()+7*864e5));}catch(e){}
  if(document.readyState==='loading')await new Promise(r=>addEventListener('DOMContentLoaded',r,{once:true}));
  if(shown&&!calm()){card.classList.add('is-leaving');try{sessionStorage.setItem('nav','1');}catch(e){}await new Promise(r=>setTimeout(r,240));}
  else await new Promise(r=>setTimeout(r,0));
  document.open();document.write(html);document.close();
}
try{
  const saved=localStorage.getItem('gate.key');
  if(saved&&localStorage.getItem('gate.salt')===payload.salt&&Number(localStorage.getItem('gate.until'))>Date.now()){
    const key=await crypto.subtle.importKey('raw',b64(saved),{name:'AES-GCM'},true,['decrypt']);
    await unlock(key,false);return;
  }
}catch(e){try{localStorage.removeItem('gate.key');}catch(_){}}
document.documentElement.classList.add('ready');
form.login.focus({preventScroll:true});
form.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';btn.disabled=true;card.classList.add('is-busy');form.classList.remove('is-wrong');
  try{
    const key=await keyFrom(form.login.value,form.password.value);
    await unlock(key,true);
  }catch(ex){
    err.textContent=TEXT.wrong;btn.disabled=false;card.classList.remove('is-busy','is-leaving');
    void form.offsetWidth;form.classList.add('is-wrong');form.password.select();
  }
});
})();
</script></body></html>
