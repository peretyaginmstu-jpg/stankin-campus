(async()=>{
const payload=JSON.parse(document.getElementById('gate-data').textContent);
const TEXT=payload.text;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const SEP=String.fromCharCode(0);
const form=document.getElementById('gate-form'),err=document.getElementById('gate-error'),btn=form.querySelector('button');
window.__gateReady=true;
if(!(window.crypto&&crypto.subtle&&window.TextEncoder)){document.documentElement.classList.add('ready');btn.disabled=true;err.textContent=TEXT.insecure;return;}
async function keyFrom(login,password){
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(login.trim().toLowerCase()+SEP+password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.it,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unlock(key){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.data));
  const html=new TextDecoder().decode(plain);
  const exported=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));
  try{localStorage.setItem('gate.key',exported);localStorage.setItem('gate.salt',payload.salt);localStorage.setItem('gate.until',String(Date.now()+7*864e5));}catch(e){}
  if(document.readyState==='loading')await new Promise(r=>addEventListener('DOMContentLoaded',r,{once:true}));
  await new Promise(r=>setTimeout(r,0));
  document.open();document.write(html);document.close();
}
try{
  const saved=localStorage.getItem('gate.key');
  if(saved&&localStorage.getItem('gate.salt')===payload.salt&&Number(localStorage.getItem('gate.until'))>Date.now()){
    const key=await crypto.subtle.importKey('raw',b64(saved),{name:'AES-GCM'},true,['decrypt']);
    await unlock(key);return;
  }
}catch(e){try{localStorage.removeItem('gate.key');}catch(_){}}
document.documentElement.classList.add('ready');
form.login.focus();
form.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';btn.disabled=true;form.parentElement.classList.add('is-busy');
  try{
    const key=await keyFrom(form.login.value,form.password.value);
    await unlock(key);
  }catch(ex){
    err.textContent=TEXT.wrong;btn.disabled=false;form.parentElement.classList.remove('is-busy');form.password.select();
  }
});
})();
</script></body></html>
