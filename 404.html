</style></head><body><p class="gate-wm" aria-hidden="true">Новый кампус</p><main class="gate"><img class="gate-logo" src="/stankin-campus/assets/stankin-official-white.svg" width="888" height="264" alt="СТАНКИН"><p class="gate-eyebrow">Предварительная версия · доступ по приглашению</p><h1>Новый кампус СТАНКИНА</h1><form id="gate-form" autocomplete="on"><label>Логин<input name="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button type="submit"><span>Войти</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button><p class="gate-error" id="gate-error" role="alert" aria-live="polite"></p></form><p class="gate-note">Материалы проекта нового кампуса МГТУ «СТАНКИН» предназначены для согласования. Архитектурные изображения — проектные визуализации.</p></main><script type="application/json" id="gate-data">{"v":1,"it":250000,"salt":"/NVFQHpCmvkHtvVLMU0aGw==","iv":"0EGa5FCEt5ke7BD2","data":"iar6ONa1RBXwo8CiwwO3zQsTHvtP7YVxsIXFyLzucn6WrmzQ+6Qas4q44QxHoKAASeV4tylp3z2oTu9Ep9QubescteZn+ebEZChi74a2nR4jhkG3b6huiJtutga/caUYuLLbcePxRO9IXHmhsEkSYeo/uIDNStMJPi1OCEyymg5wk/dSb/LF5QXLuZYgPhi0T8JGIym5xX3015EKcxDelwOp20K2FRA1By1e4E6d/Xy+NI0y8CEXE2x7bFsoF2KnJro7Sjn2SPqnss9ONwqYTH8ao9ElfwBqdgSWqItaDYULQhZHJ7ntUinSAI2HswCzx0jtjRPnwPCJjzaTIXN7m60x1nhebZoYiGjpdP0LwusxZvx+Uae047K5jRyrYr1zuKSz4tTwZsxje2CRzcXAmTTVpDm7P2CLeZIoMAMSJQ12jI4bUvIyZdg8pg8TEc1hI5dhgf1SYFrfgfKB64xXm/XM1EGnp+wiO++rV+2OeGN8ZQNinqac6uq5obib81goIuFE72LFlOaWQY6sFm4j4XTbbudBGU0DvH3vnkOqA9aazIjqmYyDsm2hZT5heT013ZKjK4khFVHmhywiwov4khKT4VUmMizqSEy+66M5NQtvhq880vT0NpMbMLY6jZ8rj77ld0x4iDgBf8Ebk2cT5qP5RGu08eMaiqPKjLe0iDtGAkMK3FcxbGCr6W8crAruTjMwtSZ0fqKzcGgWi1ZylTZEhBKie+9xvV/MQwd3/ijaad7OaZUUEfAWzNOhRSAlpqRfdlBQY2SQq4ezSNwcUkvGmQS5OJTD (async()=>{
const payload=JSON.parse(document.getElementById('gate-data').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const SEP=String.fromCharCode(0);
const form=document.getElementById('gate-form'),err=document.getElementById('gate-error'),btn=form.querySelector('button');
async function keyFrom(login,password){
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(login.trim().toLowerCase()+SEP+password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.it,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unlock(key){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.data));
  const html=new TextDecoder().decode(plain);
  const exported=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));
  try{localStorage.setItem('gate.key',exported);localStorage.setItem('gate.salt',payload.salt);localStorage.setItem('gate.until',String(Date.now()+7*864e5));}catch(e){}
  if(document.readyState==='loading')await new Promise(r=>addEventListener('DOMContentLoaded',r,{once:true}));
  await new Promise(r=>setTimeout(r,0));
  document.open();document.write(html);document.close();
}
try{
  const saved=localStorage.getItem('gate.key');
  if(saved&&localStorage.getItem('gate.salt')===payload.salt&&Number(localStorage.getItem('gate.until'))>Date.now()){
    const key=await crypto.subtle.importKey('raw',b64(saved),{name:'AES-GCM'},true,['decrypt']);
    await unlock(key);return;
  }
}catch(e){try{localStorage.removeItem('gate.key');}catch(_){}}
document.documentElement.classList.add('ready');
form.login.focus();
form.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';btn.disabled=true;form.parentElement.classList.add('is-busy');
  try{
    const key=await keyFrom(form.login.value,form.password.value);
    await unlock(key);
  }catch(ex){
    err.textContent='Неверный логин или пароль.';btn.disabled=false;form.parentElement.classList.remove('is-busy');form.password.select();
  }
});
})();
