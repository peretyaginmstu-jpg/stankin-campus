</style></head><body><p class="gate-wm" aria-hidden="true">Новый кампус</p><main class="gate"><img class="gate-logo" src="/stankin-campus/assets/stankin-official-white.svg" width="888" height="264" alt="СТАНКИН"><p class="gate-eyebrow">Предварительная версия · доступ по приглашению</p><h1>Новый кампус СТАНКИНА</h1><form id="gate-form" autocomplete="on"><label>Логин<input name="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button type="submit"><span>Войти</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button><p class="gate-error" id="gate-error" role="alert" aria-live="polite"></p></form><p class="gate-note">Материалы проекта нового кампуса МГТУ «СТАНКИН» предназначены для согласования. Архитектурные изображения — проектные визуализации.</p></main><script type="application/json" id="gate-data">{"v":1,"it":250000,"salt":"y8U4iqx+PvgJc25B2d07ZA==","iv":"4L5oLChFChvvp7XL","data":"l2kAtq4AJIIxDvQTk4iFHvgEX5Jfmwf5lFDy9fJJk7d5TkzQ2jw2s+M2YVo0iPTzEQI1qCD7LiJaZlzwgSfOSD+PkIGhEiskm5oYH5Cwk4ZVMctsH+AwKTLQUNrUxYjS0SorBk6u5kPSzIccmILJFB+sW/Ijdo0FdUWl1GpYMuGj3d2w+7kERaTFvkcRbNSuwjf2NjRafy75Kspr0Eocvg9hke2nICfUtfFoiXMCVV5jB1vmpJiNQFq/TltmmvswwiTwESnob7kZ+9cKjGEudaMGhdwvOwkst2E6A3uaV5CRxIR8aYPfDHLbz1XgdDS7EeI3LWKfOxfp9Gwm9qY75UR84J+uRITmVLKZaUGUv+IYEBmQj6hWYlUwDypxo8mHJ/88ZlN3spKWCovhqiHya0Zm3nTu5T8nfsrQFl+XlOrHCZoTArm2DI2heKNPCbnnWyBYF7UiO4F49wJzzviWmeijzUllCguGwNUzJ4EBEH9dSEvDSGbLpDLIs49+44LOdNjsQfyRce/e0mR7z/nwc1hnuj/e4xFjWTtrUbZ+g1HQrI5N11xRqVmAUFh3o9Upq3xAECQC0eQnrgbcCqWF8b5HQCJCJh1YZEGwSHUWBwv/O/7AbZ5lTgfFIhmU//YrUM3dzRhftBQx9WMtP25HMfV4fQFJLZQ6WAlIMyOEMt07on3T4ueOYJHW+cEQ75kcWSoXXFMiDhNyEpuM04NPhS7R6x2XA5M+CpTVuydyp+znIw2Zs5Yi4RkNbswlpHbt6LlChl6IZbtEhryyaOAXr30WwcQoPdmL (async()=>{
const payload=JSON.parse(document.getElementById('gate-data').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const SEP=String.fromCharCode(0);
const form=document.getElementById('gate-form'),err=document.getElementById('gate-error'),btn=form.querySelector('button');
async function keyFrom(login,password){
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(login.trim().toLowerCase()+SEP+password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.it,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unlock(key){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.data));
  const html=new TextDecoder().decode(plain);
  const exported=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));
  try{localStorage.setItem('gate.key',exported);localStorage.setItem('gate.salt',payload.salt);localStorage.setItem('gate.until',String(Date.now()+7*864e5));}catch(e){}
  if(document.readyState==='loading')await new Promise(r=>addEventListener('DOMContentLoaded',r,{once:true}));
  await new Promise(r=>setTimeout(r,0));
  document.open();document.write(html);document.close();
}
try{
  const saved=localStorage.getItem('gate.key');
  if(saved&&localStorage.getItem('gate.salt')===payload.salt&&Number(localStorage.getItem('gate.until'))>Date.now()){
    const key=await crypto.subtle.importKey('raw',b64(saved),{name:'AES-GCM'},true,['decrypt']);
    await unlock(key);return;
  }
}catch(e){try{localStorage.removeItem('gate.key');}catch(_){}}
document.documentElement.classList.add('ready');
form.login.focus();
form.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';btn.disabled=true;form.parentElement.classList.add('is-busy');
  try{
    const key=await keyFrom(form.login.value,form.password.value);
    await unlock(key);
  }catch(ex){
    err.textContent='Неверный логин или пароль.';btn.disabled=false;form.parentElement.classList.remove('is-busy');form.password.select();
  }
});
})();
