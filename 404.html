</style></head><body><p class="gate-wm" aria-hidden="true">Новый кампус</p><main class="gate"><img class="gate-logo" src="/stankin-campus/assets/stankin-official-white.svg" width="888" height="264" alt="СТАНКИН"><p class="gate-eyebrow">Предварительная версия · доступ по приглашению</p><h1>Новый кампус СТАНКИНА</h1><form id="gate-form" autocomplete="on"><label>Логин<input name="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button type="submit"><span>Войти</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button><p class="gate-error" id="gate-error" role="alert" aria-live="polite"></p></form><p class="gate-note">Материалы проекта нового кампуса МГТУ «СТАНКИН» предназначены для согласования. Архитектурные изображения — проектные визуализации.</p></main><script type="application/json" id="gate-data">{"v":1,"it":250000,"salt":"3J+r0CkYyhOPX8RnKynvBA==","iv":"BNAASJjfTMO4g3yj","data":"OZgvV9pG2uQJLU1lyZ7qAL1oUtD/JeGFkXI3yokuiz7OQRRi8AS323YGdUA4+hzhvcTbdra0jlhXWur2UHD9EkhaN1C4CS+RL7jFveLDccF7bp+etYDBTwZcEe/rUfJWiH2jF5gmpGzdoXvA12iZb9Yfjof7RHM+AAdQ7XVHkV665RLdUX8V2De4PeNTGnlM/kOOYBrSrH/P3BXMZbQURvgmZ2Aoga6eIBX6ilT9BsfFKa4OnovQv4FdpkEaryBj+Rs3GMkleiOyqVy296JOlA5W57cejoLqC4ugRu3cvdmZnbEnpAtYOtp3C4NAXQej4sJVHsJA4BcAc4WsshShIvNk0Z85GWMEnYeZtKPLT/fl6UmrUyBJ5OI/rdKeeSZV0gK8gCe6SlkIRFaMggW9O9s3THqhvWdzgbRJZmnkqCuhWi/TDdDi1qd7TLSbR39XXqgOI3VPIs//VXYL7+3cCBBUQwmUe4P1HOGJSGQW3TGFeK7MFBD5RrVNve4QblSlkbJvqaxyHWX2KLJKeARh4bK8PD1oGvCYfo4XFs2WbybCBVUgjUKc9xXCg01FF0y1DZZ3NHwrjxAgtCgcUPA2Zssc6X8CUyw17fTzQmtQHMJpNxHtBTVtClovENusEesreWSOvB3HN2Ro/JEFR6ApKK6d1n8ZmjOgRNoZCVWccPXo6WdoKV3Ncc2B7VJFf58Uy1cY6YBbHc/xjWgRE/uama4XJU4UMDWEdmoHzpfF+Z585MSX9KSWkE/1vkHo8O9fAOtmt6oN8L0kUwyonueyj2V2aveZeW79 (async()=>{
const payload=JSON.parse(document.getElementById('gate-data').textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const SEP=String.fromCharCode(0);
const form=document.getElementById('gate-form'),err=document.getElementById('gate-error'),btn=form.querySelector('button');
async function keyFrom(login,password){
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(login.trim().toLowerCase()+SEP+password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.it,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function unlock(key){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.data));
  const html=new TextDecoder().decode(plain);
  const exported=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));
  try{localStorage.setItem('gate.key',exported);localStorage.setItem('gate.salt',payload.salt);localStorage.setItem('gate.until',String(Date.now()+7*864e5));}catch(e){}
  if(document.readyState==='loading')await new Promise(r=>addEventListener('DOMContentLoaded',r,{once:true}));
  await new Promise(r=>setTimeout(r,0));
  document.open();document.write(html);document.close();
}
try{
  const saved=localStorage.getItem('gate.key');
  if(saved&&localStorage.getItem('gate.salt')===payload.salt&&Number(localStorage.getItem('gate.until'))>Date.now()){
    const key=await crypto.subtle.importKey('raw',b64(saved),{name:'AES-GCM'},true,['decrypt']);
    await unlock(key);return;
  }
}catch(e){try{localStorage.removeItem('gate.key');}catch(_){}}
document.documentElement.classList.add('ready');
form.login.focus();
form.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';btn.disabled=true;form.parentElement.classList.add('is-busy');
  try{
    const key=await keyFrom(form.login.value,form.password.value);
    await unlock(key);
  }catch(ex){
    err.textContent='Неверный логин или пароль.';btn.disabled=false;form.parentElement.classList.remove('is-busy');form.password.select();
  }
});
})();
